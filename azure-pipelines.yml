trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

parameters:
  - name: containerRegistryServiceConnection
    type: string
    default: ''
  - name: azureSubscriptionServiceConnection
    type: string
    default: ''
  - name: deployEnabled
    type: boolean
    default: false

variables:
  imageRepository: 'sum-two'
  dockerfilePath: 'Dockerfile'
  acrLoginServer: 'yourregistry.azurecr.io'
  appPort: '8080'
  healthPath: '/'
  azureResourceGroup: 'rg-sum-two-demo'
  azureContainerGroupName: 'cg-sum-two'
  azureLocation: 'eastus'
  containerCpu: '0.5'
  containerMemory: '1.0'
  imageTag: '$(Build.SourceVersion)'

stages:
  - stage: Verify
    displayName: Verify Build and Runtime
    jobs:
      - job: Verify
        displayName: Build image and run smoke checks
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - script: |
              set -eux
              echo "Static vanilla app: no dependency install step required."
              echo "Static vanilla app: no compile/build step required."
            displayName: Project checks

          - script: |
              set -eux
              docker build -t $(imageRepository):$(Build.BuildId) -f $(dockerfilePath) .
            displayName: Build Docker image

          - script: |
              set -eux
              docker run -d --name $(imageRepository)-verify -p $(appPort):80 $(imageRepository):$(Build.BuildId)
            displayName: Start container

          - script: |
              set -eux
              for i in {1..20}; do
                status=$(curl -s -o /tmp/health.txt -w '%{http_code}' http://127.0.0.1:$(appPort)$(healthPath) || true)
                if [ "$status" = "200" ]; then
                  echo "Health check passed with status 200"
                  break
                fi
                if [ "$i" -eq 20 ]; then
                  echo "Health check failed after retries; last status: ${status:-none}"
                  exit 1
                fi
                sleep 2
              done
            displayName: Wait for HTTP readiness

          - script: |
              set -eux
              curl -fsS http://127.0.0.1:$(appPort)$(healthPath) | grep -q 'sum two'
              echo "HTTP smoke test passed"
            displayName: HTTP smoke test

          - script: docker logs $(imageRepository)-verify
            displayName: Capture container logs on failure
            condition: failed()

          - script: |
              docker rm -f $(imageRepository)-verify || true
            displayName: Cleanup container
            condition: always()

  - ${{ if ne(parameters.containerRegistryServiceConnection, '') }}:
      - stage: Publish
        displayName: Publish Image
        dependsOn: Verify
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        jobs:
          - job: Publish
            pool:
              vmImage: 'ubuntu-latest'
            steps:
              - task: Docker@2
                displayName: Build and push image to ACR
                inputs:
                  containerRegistry: ${{ parameters.containerRegistryServiceConnection }}
                  repository: '$(imageRepository)'
                  command: 'buildAndPush'
                  Dockerfile: '$(dockerfilePath)'
                  tags: |
                    $(imageTag)
                    $(Build.BuildId)
                    latest

  - ${{ if and(parameters.deployEnabled, ne(parameters.containerRegistryServiceConnection, ''), ne(parameters.azureSubscriptionServiceConnection, '')) }}:
      - stage: Deploy
        displayName: Deploy to Azure Container Instances
        dependsOn: Publish
        condition: succeeded()
        jobs:
          - deployment: DeployACI
            displayName: Deploy container image
            environment: 'sum-two-prod'
            strategy:
              runOnce:
                deploy:
                  steps:
                    - task: AzureCLI@2
                      displayName: Create or update ACI
                      inputs:
                        azureSubscription: ${{ parameters.azureSubscriptionServiceConnection }}
                        scriptType: 'bash'
                        scriptLocation: 'inlineScript'
                        inlineScript: |
                          set -eux
                          IMAGE="$(acrLoginServer)/$(imageRepository):$(imageTag)"

                          az container create \
                            --resource-group "$(azureResourceGroup)" \
                            --name "$(azureContainerGroupName)" \
                            --image "$IMAGE" \
                            --dns-name-label "$(azureContainerGroupName)" \
                            --ports 80 \
                            --cpu "$(containerCpu)" \
                            --memory "$(containerMemory)" \
                            --location "$(azureLocation)" \
                            --restart-policy Always \
                            --registry-login-server "$(acrLoginServer)" \
                            --registry-username "$(ACR_USERNAME)" \
                            --registry-password "$(ACR_PASSWORD)" \
                            --query "provisioningState"
