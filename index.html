<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sum two</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <section class="card">
        <h1 id="app-title">sum two</h1>
        <p class="subtitle">Enter two numbers and calculate their sum instantly.</p>

        <form id="sum-form" novalidate>
          <div class="field-group">
            <label for="first-number">First number</label>
            <input
              id="first-number"
              name="firstNumber"
              type="number"
              inputmode="decimal"
              step="any"
              placeholder="e.g. 2"
              aria-describedby="feedback"
              required
            />
          </div>

          <div class="field-group">
            <label for="second-number">Second number</label>
            <input
              id="second-number"
              name="secondNumber"
              type="number"
              inputmode="decimal"
              step="any"
              placeholder="e.g. 3"
              aria-describedby="feedback"
              required
            />
          </div>

          <button type="submit" class="btn">Calculate</button>
        </form>

        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
